services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/tasks.sqlite
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
